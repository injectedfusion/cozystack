# turing-pi2 variant overlay.
#
# Single-tenant Cozystack profile for a Turing Pi 2 board (4x RK1 arm64 SoC):
#   - system enabled: full engine/dashboard + LINSTOR storage + monitoring
#   - networking: noop (bring-your-own Cilium; the shared RTL8370 switch fabric
#     can't carry a kube-ovn overlay - see ADR-0015/0016). The turing-pi2 block in
#     templates/bundles/system.yaml + _helpers.tpl excludes kube-ovn, MetalLB and
#     Multus so the install never perturbs the existing Cilium (BGP/LB-IPAM).
#   - paas enabled: managed-app catalog (postgres/redis/kafka/...) for the dashboard.
#   - iaas/naas disabled: tenant Kubernetes, VPC and KubeVirt need kube-ovn; run
#     KubeVirt vanilla off-platform if VMs are ever wanted (PoC-only on this board).
migrations:
  enabled: true
bundles:
  system:
    enabled: true
    variant: "turing-pi2"
  iaas:
    enabled: false
  paas:
    enabled: true
  naas:
    enabled: false
# Single-tenant homelab on mishawaka.d3fi.net. Ingress is pure Cilium Gateway
# API (Envoy), not the bundled ingress-nginx (amd64-only image, deprecated
# upstream anyway) - the dashboard/keycloak Ingress objects cozystack emits are
# inert here; Gateway + HTTPRoute are authored out-of-band per host.
publishing:
  host: "mishawaka.d3fi.net"
  certificates:
    # DNS-01 via Cloudflare (cloudflare-api-token-secret in cozy-cert-manager).
    # Required for wildcard/intranet hosts that LE can't HTTP-01 validate.
    solver: dns01
    issuerName: letsencrypt-prod
# OIDC SSO via the bundled Keycloak (quay.io/keycloak/keycloak:26.5.2 is arm64).
# Enabling this deploys keycloak + keycloak-operator + keycloak-configure (which
# auto-creates the `cozy` realm + `dashboard` client from publishing.host), flips
# the cozystack-engine to its oidc variant, and switches the dashboard gatekeeper
# from the token-proxy to oauth2-proxy -> Keycloak.
authentication:
  oidc:
    enabled: true
    # Backend-to-backend OIDC calls go direct to the in-cluster Keycloak Service
    # (avoids hairpinning the gatekeeper pod out through the Gateway LB IP).
    keycloakInternalUrl: "http://keycloak-http.cozy-keycloak.svc:8080/realms/cozy"
